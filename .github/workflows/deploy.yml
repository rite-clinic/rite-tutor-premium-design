name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check application
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run lint
          npm test

      - name: Build Project
        run: npm run build

      - name: Validate public HTML and Apache routing
        run: |
          npm run check:seo
          sudo apt-get update
          sudo apt-get install -y apache2 openssl
          bash scripts/test-apache.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload Build
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/rite-tutor-dist/

      - name: Deploy to Apache
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo rsync -av --delete /tmp/rite-tutor-dist/ /var/www/html/rite-tutor-premium-design/dist/"

      - name: Fix Permissions
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo chown -R www-data:www-data /var/www/html/rite-tutor-premium-design/dist"
