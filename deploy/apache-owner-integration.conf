# Merge into the EXISTING Apache vhosts after reviewing `apachectl -S` and
# ProxyPass/Alias/rewrite routing. Do not replace the backend/application vhost.
# Requires mod_headers. Authentication remains enforced by the existing app.
<LocationMatch "^/(sign-in|sign-up|register|login|dashboard|student|admin|thank-you)(/|$)">
    Header always set X-Robots-Tag "noindex, nofollow"
</LocationMatch>

# In the port-80 vhost, replace the historical blanket 302 HTTPS redirect.
# This generic transport upgrade preserves API methods and the existing host.
# Generated public-route rules in dist then consolidate public pages to www.
# Use the host allowlist; never reflect an arbitrary Host header.
# RewriteEngine On
# RewriteCond %{HTTP_HOST} ^(www\.)?ritetutor\.com$ [NC]
# RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]

# Frontend document directory: merge permissions with existing access controls.
# <Directory /var/www/html/rite-tutor-premium-design/dist>
#     AllowOverride FileInfo Indexes Options=Indexes,MultiViews
#     Require all granted
# </Directory>

# Do not apply a blanket non-www redirect to authenticated/API routes: cookies,
# CORS, callbacks and separate application routing must be tested first.
# Keep authenticated staging access controls. Add staging X-Robots-Tag at the
# staging vhost only; never copy staging noindex into the production vhost.
